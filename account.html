<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>My Account - DubaiStore</title>
    <link rel="stylesheet" href="assets/css/main.css">
    <link href="https://fonts.googleapis.com/css2?family=Inter:wght@300;400;500;600;700;800&display=swap" rel="stylesheet">
    <link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.5.1/css/all.min.css">
    <style>
        .account-header {
            background: linear-gradient(135deg, #667eea, #764ba2);
            padding: 3rem 0;
            color: white;
            text-align: center;
        }
        
        .account-header h1 {
            font-size: 2.5rem;
            margin-bottom: 0.5rem;
        }
        
        .account-card {
            max-width: 500px;
            margin: 4rem auto;
            background: white;
            border-radius: 1.5rem;
            padding: 2.5rem;
            box-shadow: 0 10px 30px rgba(0,0,0,0.1);
            text-align: center;
        }
        
        .avatar {
            width: 100px;
            height: 100px;
            background: linear-gradient(135deg, #667eea, #764ba2);
            border-radius: 50%;
            display: flex;
            align-items: center;
            justify-content: center;
            margin: 0 auto 1.5rem;
        }
        
        .avatar i {
            font-size: 3rem;
            color: white;
        }
        
        .account-card h2 {
            margin-bottom: 0.5rem;
        }
        
        .account-card p {
            color: #64748b;
            margin-bottom: 1.5rem;
        }
        
        .contact-buttons {
            display: flex;
            gap: 1rem;
            justify-content: center;
            margin-top: 1.5rem;
        }
        
        .demo-message {
            background: #f8fafc;
            padding: 1rem;
            border-radius: 0.5rem;
            margin-top: 1.5rem;
            color: #64748b;
            font-size: 0.875rem;
        }
    </style>
</head>
<body>
    <div id="header-placeholder"></div>

    <div class="account-header">
        <div class="container">
            <h1>👤 My Account</h1>
            <p>Manage your profile and orders</p>
        </div>
    </div>

    <div class="container">
        <div class="account-card">
            <div class="avatar">
                <i class="fas fa-user"></i>
            </div>
            <h2>Welcome Guest!</h2>
            <p>Sign in to access your account</p>
            
            <div class="contact-buttons">
                <a href="contact.html" class="btn btn-primary">
                    <i class="fas fa-envelope"></i> Contact Support
                </a>
                <a href="shop.html" class="btn btn-outline">
                    <i class="fas fa-shopping-bag"></i> Start Shopping
                </a>
            </div>
            
            <div class="demo-message">
                <i class="fas fa-info-circle"></i>
                This is a demo account page. For full account features, please contact the developer.
            </div>
        </div>
    </div>

    <div id="footer-placeholder"></div>
    <div id="bottom-nav-placeholder"></div>

    <script src="assets/js/main.js"></script>
    
    <script>
        fetch('partials/bottom-nav.html')
            .then(res => res.text())
            .then(data => {
                document.getElementById('bottom-nav-placeholder').innerHTML = data;
            })
            .catch(err => console.log('Bottom nav not found'));
    </script>
</body>
</html>
